name: PR check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR to main comes ONLY from develop
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "ERROR: Pull requests into 'main' are only allowed from 'develop'."
          echo "Your source branch: ${{ github.head_ref }}"
          exit 1

      - name: Ensure PR to develop does NOT come from main
        if: github.base_ref == 'develop' && github.head_ref == 'main'
        run: |
          echo "ERROR: Pull requests into 'develop' cannot come directly from 'main'."
          exit 1
