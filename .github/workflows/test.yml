name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule' || github.repository == 'gklvns/validator'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macos-latest ] # windows-latest
        php: [ '8.5' ]
        dependency_version: [ prefer-stable ]

    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ matrix.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ matrix.os }}-php-${{ matrix.php }}-composer-

      - name: Install PHP dependencies
        shell: bash
        env:
          COMPOSER_ROOT_VERSION: 5.x-dev
        run: composer update --${{ matrix.dependency_version }} --no-interaction --no-progress --ansi

      - name: Tests
        run: composer test

      - name: Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/
          retention-days: 7

      - name: Infection
        uses: actions/upload-artifact@v4
        with:
          name: infection
          path: build/infection/
          retention-days: 7
